<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Itrat's Daily Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#E6F0FB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&family=Amiri+Quran&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone-first single column; painted meadow hero that grows with the day's progress; fixed bottom tab bar. Light storybook look by choice. */
:root{
  --bg:#F3F4F2; --card:#FFFDF8; --soft:#F6F3E7; --line:#E7E1CD; --line2:#D8D1B8;
  --ink:#2C3A2B; --muted:#667260; --dim:#9AA290;
  --grass:#4E8F40; --grass2:#7DBA62; --leaf:#A9D58A; --sky:#5FA8D8; --sun:#F3BE4A; --sun2:#FFE08A; --peach:#F0A27C; --rose:#E58C9D; --lilac:#A795DA; --wood:#8A5E3B;
  --accent:#3F6FB0; --accent-soft:#E6EEF9; --good:#4E9E5C; --warn:#E49A3A; --bad:#D9637A;
  --display:"Fredoka","Nunito",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  --arabic:"Amiri Quran","Amiri","Traditional Arabic","Noto Naskh Arabic",serif;
  --r:22px; color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:linear-gradient(180deg,#E6F0FB 0%,#F3F4F2 35%,#FBF2E6 100%) fixed,var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(104px + env(safe-area-inset-bottom,0px));min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#E6F0FB}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:clamp(26px,7.4vw,34px);line-height:1.05}
h2{font-size:20px;line-height:1.2}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
b{font-weight:800}
a{color:#2F7DB3;font-weight:700}

/* hero meadow */
.hero{position:relative;overflow:hidden;border-radius:30px;isolation:isolate;background:var(--sky-bg);transition:background .8s ease;
  box-shadow:0 18px 36px -22px rgba(120,100,200,.55),inset 0 0 0 1px rgba(255,255,255,.6)}
body[data-phase="dawn"]{--sky-bg:linear-gradient(170deg,#FFE3B8 0%,#FFC7C9 50%,#DCCBFF 100%)}
body[data-phase="day"]{--sky-bg:linear-gradient(170deg,#BDE5FF 0%,#A9E6F0 55%,#D3F7DE 100%)}
body[data-phase="gold"]{--sky-bg:linear-gradient(170deg,#FFE6A6 0%,#FFC9A6 55%,#FFB9C9 100%)}
body[data-phase="dusk"]{--sky-bg:linear-gradient(170deg,#CFC2FF 0%,#F2B9D9 55%,#FFCFB0 100%)}
body[data-phase="night"]{--sky-bg:linear-gradient(170deg,#AFB5F2 0%,#C9B6EE 55%,#F0C6E2 100%)}
.hero{min-height:360px;display:flex;flex-direction:column}
.hero-photo{position:absolute;inset:0;z-index:-1;width:100%;height:100%;object-fit:cover;object-position:62% 55%;opacity:0;transition:opacity .7s ease;animation:breathe 30s ease-in-out infinite alternate}
.hero-photo.on{opacity:1}
@keyframes breathe{from{transform:scale(1.02)}to{transform:scale(1.09)}}
.hero.has-photo .hero-art{opacity:0}
.hero-shade{position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,0) 55%,rgba(255,253,248,.35) 100%)}
.hero-art{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden;transition:opacity .7s}
.hero-art .glow{position:absolute;width:260px;height:260px;right:-60px;top:-80px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.85),rgba(255,255,255,0) 65%)}
.cloud{position:absolute;left:0;width:110px;height:34px;border-radius:40px;background:#fff;opacity:.9;box-shadow:0 8px 14px -10px rgba(120,110,180,.5);animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:48px;height:48px;left:16px;top:-24px}
.cloud::after{width:36px;height:36px;left:54px;top:-16px}
.cloud.c1{top:62%;transform:scale(.9);animation-duration:70s;animation-delay:-20s}
.cloud.c2{top:30%;transform:scale(.6);opacity:.75;animation-duration:95s;animation-delay:-60s}
.cloud.c3{top:78%;transform:scale(1.15);animation-duration:85s;animation-delay:-5s}
@keyframes drift{from{left:-160px}to{left:calc(100% + 40px)}}
.spark{position:absolute;width:14px;height:14px;opacity:0;animation:tw 3s ease-in-out infinite}
.spark svg{width:100%;height:100%;fill:#fff}
body[data-phase="night"] .spark,body[data-phase="dusk"] .spark,body[data-phase="dawn"] .spark{opacity:1}
@keyframes tw{0%,100%{transform:scale(.5);opacity:.3}50%{transform:scale(1);opacity:1}}
.hero-in{padding:14px 14px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
.hero-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.glass{background:rgba(255,253,246,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.8);border-radius:20px;padding:10px 14px;display:flex;flex-direction:column;gap:4px;min-width:0;box-shadow:0 6px 16px -10px rgba(40,60,40,.5)}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#B5552F}
.meadow{font-size:13px;color:#4A4F6B;font-weight:800}
.datenav{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:2px}
.datenav button{background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:800;min-height:30px}
.save{font-size:11px;color:var(--muted);font-family:var(--mono)}
.dial{flex:none;position:relative;width:82px;height:82px;border-radius:50%;background:rgba(255,253,246,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 6px 16px -10px rgba(40,60,40,.5)}
.dial svg{width:82px;height:82px;transform:rotate(-90deg)}
.dial .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.dial .n b{font-family:var(--display);font-size:25px;font-weight:600}
.dial .n span{font-size:9px;color:var(--muted);margin-top:3px;letter-spacing:.12em;text-transform:uppercase;font-weight:800}
.arc{width:100%;height:auto;display:block;overflow:visible;margin-top:auto;padding-top:10px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(6,1fr);gap:2px;
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));
  background:rgba(255,253,246,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);box-shadow:0 -8px 24px -18px rgba(50,70,40,.6)}
.nav button{background:none;border:0;border-radius:16px;padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--dim);font-size:10.5px;font-weight:800;min-height:52px}
.nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
@media (min-width:700px){.nav{left:50%;right:auto;width:600px;transform:translateX(-50%);bottom:12px;border-radius:24px;border:1px solid var(--line);padding:6px 10px}}

/* sections */
.panel{display:flex;flex-direction:column;gap:14px;animation:rise .35s ease both}
@keyframes rise{from{transform:translateY(6px)}to{transform:none}}
.sec{background:var(--card);border:1px solid #EEE8D6;border-radius:var(--r);padding:18px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 26px -20px rgba(60,80,40,.55)}
.sec .head{display:flex;flex-direction:column;gap:6px}
.why{font-size:12.8px;color:#58617A;line-height:1.5;padding:9px 11px;border-radius:12px;background:#EEF3FB;border:1px solid #D9E4F4}
.why::before{content:"Why · ";color:var(--accent);font-weight:800}
.hint{font-size:13px;color:var(--muted)}
input[type=text],input[type=number],input[type=time],textarea,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--soft);border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;transition:border-color .2s,box-shadow .2s,background .2s}
input::placeholder,textarea::placeholder{color:var(--dim)}
input:focus,textarea:focus,select:focus{border-color:#7FA6DA;background:#fff;box-shadow:0 0 0 4px rgba(95,143,211,.18);outline:none}
textarea{min-height:96px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.grow{flex:1 1 170px}
.field{display:flex;flex-direction:column;gap:6px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1.5px solid var(--line);background:var(--soft);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:800;color:var(--muted);min-height:40px;transition:all .2s}
.pill[aria-pressed="true"]{background:linear-gradient(135deg,var(--sun2),var(--sun));border-color:#E9B23C;color:var(--ink);box-shadow:0 5px 12px -7px rgba(220,160,40,.9)}
.task{display:flex;flex-direction:column;gap:8px;padding:14px;border:1.5px solid var(--line);border-radius:18px;background:#FFFEFA}
.task.mit{border:2px solid transparent;background:linear-gradient(#FFFBEA,#FFFBEA) padding-box,linear-gradient(135deg,var(--sun),var(--peach) 50%,var(--grass2)) border-box}
.task .grid{display:grid;grid-template-columns:1fr 150px;gap:8px}
@media (max-width:460px){.task .grid{grid-template-columns:1fr}}
.check{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:16px;background:#FFFEFA;text-align:left;width:100%;min-height:56px;transition:all .2s}
.box{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line2);background:#fff;display:flex;align-items:center;justify-content:center;transition:all .2s}
.check[aria-pressed="true"]{border-color:#BFE0AE;background:#EEF8E6}
.check[aria-pressed="true"] .box{background:linear-gradient(135deg,#8BCB6F,var(--grass));border-color:var(--grass);box-shadow:0 4px 10px -3px rgba(78,143,64,.7)}
.check[aria-pressed="true"] .box::after{content:"";width:7px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check .t{flex:1;min-width:0}
.check .t b{display:block;font-weight:800}
.check .t span{display:block}
.check[aria-pressed="true"] .t b{color:#3D7A31}
.check.star{border-color:#F3D27A;background:#FFF8E1}
.tag{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:#EAF2FB;color:#3B76A6;white-space:nowrap}
.later{font-size:13px;color:var(--muted);padding:10px 12px;border-radius:14px;background:var(--soft);border:1px dashed var(--line2)}

/* ayah */
.ayah{background:linear-gradient(170deg,#FFFDF8 0%,#EEF4FC 100%);border:1px solid #DCE6F4}
.ar{font-family:var(--arabic);direction:rtl;text-align:right;font-size:25px;line-height:2.05;color:#22304A}
.en{font-size:15.5px;line-height:1.6;color:#3C4A39}
.ref{font-size:12.5px;font-weight:800;color:var(--accent)}

/* prayers */
.prayers{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pr{border:1.5px solid var(--line);background:#FFFEFA;border-radius:16px;padding:12px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:64px;transition:all .2s}
.pr b{font-family:var(--display);font-weight:600;font-size:14.5px}
.pr small{font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--dim)}
.pr[data-s="1"]{background:linear-gradient(160deg,var(--sun2),var(--sun));border-color:#E9B23C;transform:translateY(-2px);box-shadow:0 7px 14px -8px rgba(220,160,40,.9)}
.pr[data-s="1"] small{color:#7A4F00}
.pr[data-s="2"]{border-color:#F2C089;background:#FFF2E0} .pr[data-s="2"] small{color:#B9661A}
.pr[data-s="3"]{border-color:#F2B3BF;background:#FFEFF2} .pr[data-s="3"] small{color:#C24661}

/* tasbih */
.tasbih{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
.ring{flex:none;width:180px;height:180px;border-radius:50%;border:0;padding:0;position:relative;touch-action:manipulation;background:radial-gradient(circle at 50% 45%,#FFF6D8,#FFFBEC 60%,transparent 63%);transition:transform .08s}
.ring svg{width:180px;height:180px}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-family:var(--display);font-size:40px;font-weight:600;line-height:1}
.ring .c em{font-style:normal;font-family:var(--display);font-size:12.5px;color:#B5552F;margin-bottom:6px}
.ring .c span{font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:6px;font-weight:800}
.ring:active{transform:scale(.96)}
.tasbih .side{flex:1 1 170px;display:flex;flex-direction:column;gap:10px;min-width:0}
.btn{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 16px;font-weight:800;font-size:14.5px;min-height:44px;transition:transform .1s;box-shadow:0 3px 8px -6px rgba(60,80,40,.5)}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,#5E8FD3,var(--accent));border-color:#365F9C;color:#fff;box-shadow:0 8px 16px -9px rgba(63,111,176,.95)}
.btn.sun{background:linear-gradient(135deg,var(--sun2),var(--sun));border-color:#E9B23C;color:var(--ink)}
.btn.ghost{background:transparent;box-shadow:none}
.bar{width:100%;height:10px;border-radius:10px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;border-radius:10px;background:linear-gradient(90deg,var(--grass2),var(--sun));transition:width .3s}

/* water */
.drops{display:flex;gap:6px;flex-wrap:wrap}
.drop{width:38px;height:46px;border:0;background:none;padding:0}
.drop svg{width:100%;height:100%}

/* timer */
.timer{display:flex;flex-direction:column;align-items:center;gap:14px}
.clock{font-family:var(--display);font-weight:600;font-size:64px;line-height:1;font-variant-numeric:tabular-nums;color:#3E7FB0}
.counter{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1.5px solid var(--line);border-radius:16px;background:#FFFEFA}
.counter .num{font-family:var(--display);font-weight:600;font-size:26px;min-width:2ch;text-align:center;color:#B5552F}
.tips{display:grid;gap:8px}
.tip{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:#F3F7FC;border:1px solid #DDE8F3;font-size:14px}
.tip i{flex:none;width:22px;height:22px;border-radius:50%;background:#DCEBF8;color:#3B76A6;font-style:normal;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
.banner{border-radius:18px;padding:14px 16px;background:#F3EEFF;border:1.5px solid #DCD2FA;font-size:14px}
.kind{border-radius:18px;padding:14px 16px;background:#FFF4EA;border:1.5px solid #F7D8BF;font-size:15px;font-weight:700;color:#7A4A2A}

/* quran */
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.surah{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px;border-radius:16px;background:linear-gradient(135deg,#E9F0FB,#FBF0E4);border:1px solid #DCE6F4;text-align:center}
.surah .sar{font-family:var(--arabic);font-size:24px;line-height:1.6}
.verse{display:flex;flex-direction:column;gap:6px;padding:12px 2px;border-bottom:1px solid #EFE9D7}
.verse:last-child{border-bottom:0}
.vn{align-self:flex-start;font-size:11px;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 9px}

/* money */
.money-top{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mt{border-radius:18px;padding:12px;background:var(--soft);border:1.5px solid var(--line);min-width:0}
.mt b{display:block;font-family:var(--display);font-weight:600;font-size:21px;line-height:1.15;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.mt span{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.mt.ok{background:#EEF8E6;border-color:#C7E5B6} .mt.ok b{color:#3D7A31}
.mt.hot{background:#FFF2E0;border-color:#F2C089} .mt.hot b{color:#B9661A}
.mt.over{background:#FFEFF2;border-color:#F2B3BF} .mt.over b{color:#C24661}
@media (max-width:420px){.money-top{grid-template-columns:1fr 1fr}.money-top .mt:first-child{grid-column:1/-1}}
.bar.money.hot i{background:linear-gradient(90deg,var(--sun),var(--peach))} .bar.money.over i{background:linear-gradient(90deg,var(--peach),var(--bad))}
.allow{font-size:15px;font-weight:700;padding:12px 14px;border-radius:14px;background:#FFF8E1;border:1px solid #F3E0A8}
.exp{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:14px;background:#FFFEFA}
.exp .cat{flex:none;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:#F0ECFB;color:#6A55C4}
.exp .nt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:14px}
.exp .am{font-family:var(--mono);font-variant-numeric:tabular-nums}
.del{border:0;background:none;color:var(--dim);font-size:20px;padding:4px 8px;line-height:1;min-height:36px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:150px;padding-top:18px}
.wk .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.wk .col i{display:block;width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--leaf),var(--grass2));min-height:3px}
.wk .col.today i{background:linear-gradient(180deg,var(--sun2),var(--sun))}
.wk .col.future i{background:var(--soft);border:1px dashed var(--line2)}
.wk .col em{font-style:normal;font-size:10px;font-family:var(--mono);color:var(--muted);white-space:nowrap}
.wk .col span{font-size:11px;font-weight:800;color:var(--muted)}
.catrow{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;font-size:14px}
.catrow .track{height:10px;border-radius:10px;background:var(--soft);overflow:hidden}
.catrow .track i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--lilac),var(--rose))}
.catrow .am{font-family:var(--mono);font-size:13px}

/* stats */
.bigchain{display:flex;align-items:baseline;gap:10px}
.bigchain b{font-family:var(--display);font-weight:600;font-size:62px;line-height:1;color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{border-radius:18px;padding:14px;border:1.5px solid transparent}
.stat:nth-child(1){background:#FFF8E1;border-color:#F3E0A8} .stat:nth-child(1) b{color:#A8730C}
.stat:nth-child(2){background:#EAF3FB;border-color:#CFE2F3} .stat:nth-child(2) b{color:#2F6E9E}
.stat:nth-child(3){background:#EEF8E6;border-color:#C7E5B6} .stat:nth-child(3) b{color:#3D7A31}
.stat:nth-child(4){background:#FFF0EA;border-color:#F6D2C2} .stat:nth-child(4) b{color:#B5552F}

.legend{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap;font-weight:700}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.chain{display:flex;gap:6px;flex-wrap:wrap}
.chain i{width:20px;height:20px;border-radius:50%;background:var(--soft);border:1.5px solid var(--line2)}
.chain i.k{background:radial-gradient(circle at 35% 35%,#B9E39C,var(--grass2) 55%,var(--grass));border-color:transparent}
.chain i.m{background:#fff;border:2px dashed var(--rose)}
.rt{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:14px}
.redit{display:flex;flex-direction:column;gap:8px;padding:12px;border:1.5px solid var(--line);border-radius:16px;background:#FFFEFA}
.redit .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
details{border:1.5px solid var(--line);border-radius:16px;background:#FFFEFA;padding:2px 14px}

details p{padding-bottom:12px;font-size:14px;color:var(--muted)}
details p b{color:var(--ink)}
details[open]{padding-bottom:4px}
.foot{text-align:center;font-size:12px;color:var(--dim);font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);opacity:0;z-index:60;background:#fff;border:2px solid var(--grass2);color:var(--ink);padding:11px 20px;border-radius:999px;font-weight:800;font-size:14px;box-shadow:0 14px 30px -12px rgba(60,90,40,.55);transition:all .35s cubic-bezier(.2,.9,.3,1.3);max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:55}

.ic{display:inline-flex;flex:none;width:34px;height:34px;border-radius:12px;align-items:center;justify-content:center;background:#E6EEF9;color:#3F6FB0}

.ic.blue{background:#E6EEF9;color:#3F6FB0} .ic.peach{background:#FFEBDD;color:#C2622F} .ic.green{background:#E7F4DF;color:#4E8F40}
.ic.lilac{background:#EFEAFB;color:#6A55C4} .ic.pink{background:#FDE8EE;color:#C2456A} .ic.gold{background:#FFF3D1;color:#A8730C} .ic.teal{background:#E2F4F2;color:#23807A}
.ic.sm{width:28px;height:28px;border-radius:10px} .ic.sm svg{width:16px;height:16px}
.ic.xs{width:auto;height:auto;background:none!important} .ic.xs svg{width:17px;height:17px}
h2.ht{display:flex;align-items:center;gap:10px}
.pr .ic.xs svg{width:18px;height:18px}
.pr[data-s="1"] .ic{color:#7A4F00}
.pill .ic.xs{vertical-align:-3px;margin-right:4px} .pill .ic.xs svg{width:15px;height:15px}
.stat .ic{margin-bottom:6px}
.kind{display:flex;gap:10px;align-items:center}
.tip .ic{width:26px;height:26px;border-radius:9px} .tip .ic svg{width:15px;height:15px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const DAILY=[{"ref": "94:5-6", "s": "Ash-Sharh", "se": "The Consolation", "ar": ["فَإِنَّ مَعَ الْعُسْرِ يُسْرًا", "إِنَّ مَعَ الْعُسْرِ يُسْرًا"], "en": ["But lo! with hardship goeth ease", "Lo! with hardship goeth ease"]}, {"ref": "13:28", "s": "Ar-Ra'd", "se": "The Thunder", "ar": ["الَّذِينَ آمَنُوا وَتَطْمَئِنُّ قُلُوبُهُمْ بِذِكْرِ اللَّهِ ۗ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ"], "en": ["Who have believed and whose hearts have rest in the remembrance of Allah. Verily in the remembrance of Allah do hearts find rest"]}, {"ref": "2:153", "s": "Al-Baqara", "se": "The Cow", "ar": ["يَا أَيُّهَا الَّذِينَ آمَنُوا اسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ ۚ إِنَّ اللَّهَ مَعَ الصَّابِرِينَ"], "en": ["O ye who believe! Seek help in steadfastness and prayer. Lo! Allah is with the steadfast"]}, {"ref": "39:53", "s": "Az-Zumar", "se": "The Groups", "ar": ["۞ قُلْ يَا عِبَادِيَ الَّذِينَ أَسْرَفُوا عَلَىٰ أَنْفُسِهِمْ لَا تَقْنَطُوا مِنْ رَحْمَةِ اللَّهِ ۚ إِنَّ اللَّهَ يَغْفِرُ الذُّنُوبَ جَمِيعًا ۚ إِنَّهُ هُوَ الْغَفُورُ الرَّحِيمُ"], "en": ["Say: O My slaves who have been prodigal to their own hurt! Despair not of the mercy of Allah, Who forgiveth all sins. Lo! He is the Forgiving, the Merciful"]}, {"ref": "65:3", "s": "At-Talaaq", "se": "Divorce", "ar": ["وَيَرْزُقْهُ مِنْ حَيْثُ لَا يَحْتَسِبُ ۚ وَمَنْ يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ ۚ إِنَّ اللَّهَ بَالِغُ أَمْرِهِ ۚ قَدْ جَعَلَ اللَّهُ لِكُلِّ شَيْءٍ قَدْرًا"], "en": ["And will provide for him from (a quarter) whence he hath no expectation. And whosoever putteth his trust in Allah, He will suffice him. Lo! Allah bringeth His command to pass. Allah hath set a measure for all things"]}, {"ref": "3:139", "s": "Aal-i-Imraan", "se": "The Family of Imraan", "ar": ["وَلَا تَهِنُوا وَلَا تَحْزَنُوا وَأَنْتُمُ الْأَعْلَوْنَ إِنْ كُنْتُمْ مُؤْمِنِينَ"], "en": ["Faint not nor grieve, for ye will overcome them if ye are (indeed) believers"]}, {"ref": "2:152", "s": "Al-Baqara", "se": "The Cow", "ar": ["فَاذْكُر /* ---------- state ---------- */
const DEFAULT_SETTINGS={budget:"",worryTime:"17:00",ifthen:DEFAULT_IFTHEN,project:"",routines:DEFAULT_ROUTINES,qPage:1,qPages:2,bedtime:"23:30",waterGoal:8};
let days={}, settings=JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
let cur=todayKey(), tab=defaultTab();
let mode="local", db=null, uid=null;

function pad(n){return String(n).padStart(2,"0")}
function keyOf(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function todayKey(){const d=new Date(); if(d.getHours()<3) d.setDate(d.getDate()-1); return keyOf(d)}
function parseKey(k){const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)}
function shift(k,n){const d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d)}
function diffDays(a,b){return Math.round((parseKey(b)-parseKey(a))/864e5)}
function defaultTab(){const h=new Date().getHours();return (h>=3&&h<12)?"morning":(h>=12&&h<19)?"day":"night"}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function clone(o){return JSON.parse(JSON.stringify(o))}

function blankDay(k){
  const prev=days[shift(k,-1)];
  return {date:k,sleep:"",energy:0,mood:0,dump:"",
    mit:{text:(prev&&prev.tomorrow)||"",step:"",when:"After Fajr",done:false},
    tasks:[{text:"",when:"After Dhuhr",done:false},{text:"",when:"After Asr",done:false}],
    obstacle:"",plan:"",minimum:false,
    prayers:Object.fromEntries(PRAYERS.map(p=>[p[0],0])),astaghfar:0,
    focus:0,focusMin:0,walk:false,build:false,buildNote:"",urges:0,scrollMin:"",
    wins:["","",""],shukr:["","",""],kind:"",tomorrow:"",spend:[],waitStay:0,waitSwitch:0,
    routine:{},water:0,quran:{read:false,from:0,to:0},reflect:""};
}
function day(k=cur){
  if(!days[k]) days[k]=blankDay(k);
  else { const b=blankDay(k); for(const key in b){ if(!(key in days[k])) days[k][key]=b[key]; } }
  return days[k];
}

/* ---------- routines ---------- */
function lastDone(id,before){let best=null;for(const k in days){if(k<before&&days[k].routine&&days[k].routine[id]&&(!best||k>best))best=k;}return best;}
function routineStatus(r,k){
  const d=days[k], done=!!(d&&d.routine&&d.routine[r.id]);
  if(r.freq==="weekly"){const due=parseKey(k).getDay()===Number(r.dow);return {due:due||done,done,label:DOW[Number(r.dow)]+"s",next:due?0:((Number(r.dow)-parseKey(k).getDay()+7)%7)};}
  if(r.freq==="interval"){const n=Math.max(1,Number(r.n)||1),last=lastDone(r.id,k);const gap=last?diffDays(last,k):n;return {due:gap>=n||done,done,label:"Every "+n+" days",next:Math.max(0,n-gap)};}
  return {due:true,done,label:"Daily",next:0};
}
function routinesFor(slot,k=cur){return settings.routines.filter(r=>r.slot===slot).map(r=>({r,s:routineStatus(r,k)}));}
function routineRatio(k){const all=settings.routines.map(r=>routineStatus(r,k)).filter(s=>s.due);if(!all.length)return 0;return all.filter(s=>s.done).length/all.length;}

/* ---------- scoring ---------- */
function prayed(d){return PRAYERS.filter(([p])=>d.prayers[p]===1||d.prayers[p]===2).length}
function score(d){
  if(!d) return 0;
  let s=0;
  PRAYERS.forEach(([p])=>{const v=d.prayers[p]; if(v===1) s+=8; else if(v===2) s+=5;});
  if(d.mit.done) s+=15; else if(d.mit.text) s+=3;
  if(d.focus>0) s+=Math.min(8,d.focus*4);
  if(d.astaghfar>0) s+=Math.min(7,Math.round(d.astaghfar/165*7));
  if(d.quran&&d.quran.read) s+=10;
  s+=Math.round(routineRatio(d.date)*10);
  s+=Math.min(4,Math.round((d.water||0)/(Number(settings.waterGoal)||8)*4));
  if(d.walk) s+=3; if(d.build) s+=3;
  if(d.tomorrow||(d.wins||[]).some(Boolean)) s+=3;
  return Math.min(100,s);
}
function kept(d){
  if(!d) return false;
  if(score(d)>=50) return true;
  return d.minimum && prayed(d)===5 && d.focus>0 && ((d.wins||[]).some(Boolean)||(d.shukr||[]).some(Boolean));
}
function flowersToday(d){
  let n=prayed(d);
  n+=Object.values(d.routine||{}).filter(Boolean).length;
  if(d.mit.done) n+=1; n+=d.tasks.filter(t=>t.done).length;
  n+=d.focus; if(d.quran&&d.quran.read) n+=1; if((d.water||0)>=(Number(settings.waterGoal)||8)) n+=1;
  if(d.walk) n+=1; if(d.build) n+=1;
  return n;
}
function chainLen(){
  const t=todayKey(); let chain=0,k=t,misses=0;
  if(!kept(days[t])) k=shift(t,-1);
  for(let i=0;i<500;i++){const d=days[k];
    if(kept(d)){chain++;misses=0;} else {misses++; if(misses>=2||(!d&&!days[shift(k,-1)])) break;}
    k=shift(k,-1);}
  return chain;
}

/* ---------- persistence ---------- */
function loadLocal(){
  try{const raw=localStorage.getItem(LS); if(raw){const o=JSON.parse(raw); days=o.days||{}; if(o.settings) settings={...settings,...o.settings};}}catch(e){}
  fixSettings();
}
function fixSettings(){
  if(!Array.isArray(settings.routines)||!settings.routines.length) settings.routines=clone(DEFAULT_ROUTINES);
  if(!Array.isArray(settings.ifthen)) settings.ifthen=clone(DEFAULT_IFTHEN);
  ["qPage","qPages","bedtime","waterGoal","worryTime","budget","project"].forEach(k=>{if(settings[k]===undefined) settings[k]=DEFAULT_SETTINGS[k];});
}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({days,settings}))}catch(e){}}
const timers={}, chains={};
function persist(k){
  saveLocal(); setSave("Saving…");
  clearTimeout(timers[k]);
  timers[k]=setTimeout(()=>{
    if(mode!=="db"){setSave("Saved");return;}
    const body=k==="settings"?settings:days[k]; if(!body){setSave("Saved");return;}
    const snap=clone(body);
    chains[k]=(chains[k]||Promise.resolve()).then(()=>db.collection("data/users/"+uid).doc(k).set(snap))
      .then(()=>setSave("Saved")).catch(e=>setSave(e&&e.code==="quota_exceeded"?"Storage full":"Saved on device"));
  },700);
}
function setSave(t){const el=document.getElementById("saveState"); if(el) el.textContent=t;}
async function connect(){
  if(STANDALONE||!window.claude||!window.claude.use) return;
  try{
    const [d,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!d||!u) return;
    const id=await u.id(); if(!id) return;
    db=d; uid=id;
    const snap=await db.collection("data/users/"+uid).get();
    const remote={};
    snap.docs.forEach(doc=>{ if(doc.exists) remote[doc.id]=doc.data(); });
    if(remote.settings){ settings={...settings,...clone(remote.settings)}; delete remote.settings; }
    fixSettings();
    const had=Object.keys(remote).length>0;
    Object.keys(remote).forEach(k=>{ days[k]=clone(remote[k]); });
    mode="db";
    document.getElementById("foot").textContent="Private to you · syncs across your devices";
    if(!had){ Object.keys(days).forEach(k=>persist(k)); persist("settings"); }
    saveLocal(); renderAll();
  }catch(e){}
}
async function exportData(){
  const name="planner-backup-"+todayKey()+".json", data=JSON.stringify({app:"itrat-planner",version:2,exported:new Date().toISOString(),days,settings},null,1);
  if(!STANDALONE&&window.claude&&window.claude.use){
    try{const dl=await window.claude.use("downloads"); if(dl){await dl.save({filename:name,data}); toast("Backup saved."); return;}}catch(e){ if(e&&e.code==="declined"){toast("Backup cancelled.");return;} }
  }
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);toast("Backup downloaded.");}
  catch(e){toast("Couldn't download here. Try the standalone app.");}
}
function importData(file){
  const fr=new FileReader();
  fr.onload=()=>{try{const o=JSON.parse(fr.result); if(!o||typeof o.days!=="object") throw 0;
      Object.keys(o.days).forEach(k=>{days[k]=o.days[k]; persist(k);});
      if(o.settings){settings={...settings,...o.settings}; fixSettings(); persist("settings");}
      toast("Imported "+Object.keys(o.days).length+" days."); renderAll();
    }catch(e){toast("That file isn't a planner backup.");}};
  fr.readAsText(file);
}

function getPath(o,p){return p.split(".").reduce((a,k)=>a==null?a:a[k],o)}
function setPath(o,p,v){const ks=p.split(".");let a=o;for(let i=0;i<ks.length-1;i++){a=a[ks[i]];}a[ks[ks.length-1]]=v}

/* ---------- header ---------- */
function dailyAyah(k){return DAILY[(parseKey(k).getDate()-1)%DAILY.length];}
function renderHeader(){
  const d=parseKey(cur), isToday=cur===todayKey(), h=new Date().getHours();
  document.getElementById("dateTitle").textContent=d.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
  document.getElementById("greet").textContent=isToday?(h>=3&&h<12?"Good morning, Itrat":h<17&&h>=12?"Good afternoon, Itrat":"Good evening, Itrat"):(cur<todayKey()?"Looking back":"Planning ahead");
  document.getElementById("goToday").textContent=isToday?"Today":"Back to today";
  updateScore(true);
}
function updateScore(skipMilestone){
  const dd=day(), s=score(dd);
  document.getElementById("scoreNum").textContent=s;
  document.getElementById("dialArc").setAttribute("stroke-dashoffset",String(213.6-213.6*s/100));
  const f=flowersToday(dd), c=chainLen();
  document.getElementById("meadowLine").textContent=prayed(dd)+"/5 prayers · "+f+" good thing"+(f===1?"":"s")+" done · "+c+"-day chain";
  drawArc(); setPhase();
  if(!skipMilestone) checkMilestone(); else lastScore=s;
}

/* ---------- small view helpers ---------- */
function anchorSelect(path,val){return `<select data-path="${path}" aria-label="When">${ANCHORS.map(a=>`<option${a===val?" selected":""}>${a}</option>`).join("")}</select>`;}
function scale(path,val,labels){return `<div class="pills">${labels.map((l,i)=>`<button class="pill" data-act="set" data-path="${path}" data-val="${i+1}" aria-pressed="${val===i+1}">${l}</button>`).join("")}</div>`;}
function checkBtn(path,on,title,sub,extra="",icon="",tone="blue"){return `<button class="check ${extra}" data-act="toggle" data-path="${path}" aria-pressed="${!!on}"><span class="box"></span>${icon?I(icon,tone,"sm"):""}<span class="t"><b>${title}</b>${sub?`<span class="small muted">${sub}</span>`:""}</span></button>`;}
function ayahCard(a,title){
  return `<section class="sec ayah"><div class="head"><span class="row">${I("sparkle","gold","sm")}<span class="label">${title}</span></span></div>
    <p class="ar" lang="ar">${a.ar.map(esc).join(" ۝ ")}</p>
    <p class="en">${a.en.map(esc).join(" ")}</p>

}
function routineSection(slot,title,why){
  const items=routinesFor(slot), due=items.filter(x=>x.s.due), later=items.filter(x=>!x.s.due);
  const doneN=due.filter(x=>x.s.done).length;
  return `<section class="sec"><div class="head"><div class="row" style="justify-content:space-between"><h2 class="ht">${I(slot==="morning"?"sunrise":slot==="night"?"moon":"sun",SLOT_TONE[slot])}${title}</h2><span class="tag">${doneN}/${due.length}</span></div>${why?`<p class="why">${why}</p>`:""}</div>
    ${due.map(({r,s})=>`<button class="check ${r.star?"star":""}" data-act="routine" data-id="${esc(r.id)}" aria-pressed="${s.done}"><span class="box"></span>${I(routineIcon(r),r.star?"gold":SLOT_TONE[slot],"sm")}<span class="t"><b>${esc(r.name)}</b>${r.note?`<span class="small muted">${esc(r.note)}</span>`:""}</span>${r.freq!=="daily"?`<span class="tag">${s.label}</span>`:""}</button>`).join("")||`<p class="hint">Nothing due here today.</p>`}
    ${later.length?`<p class="later">Not today: ${later.map(({r,s})=>`${esc(r.name)} (${r.freq==="weekly"?"on "+s.label.replace(/s$/,""):"in "+s.next+" day"+(s.next===1?"":"s")})`).join(" · ")}</p>`:""}
  </section>`;
}

function ringSVG(n){
  const inRound=n%33===0&&n>0?33:n%33, beads=[];
  for(let i=0;i<33;i++){const a=(i/33)*Math.PI*2-Math.PI/2, x=90+74*Math.cos(a), y=90+74*Math.sin(a);
    beads.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${i===0?6.5:5}" fill="${i<inRound?"#7DBA62":"#FFFFFF"}" stroke="${i<inRound?"#4E8F40":"#DCD5BE"}" stroke-width="1.5"/>`);}
  return `<svg viewBox="0 0 180 180" aria-hidden="true"><circle cx="90" cy="90" r="74" fill="none" stroke="#E5DCC0" stroke-width="1.5"/>${beads.join("")}</svg>`;
}

/* ---------- quran ---------- */
let Q=null, Qloading=false, Qerr=false, pageIdx=null;
function loadQuran(){
  if(Q||Qloading) return; Qloading=true; Qerr=false;
  fetch("quran.json").then(r=>{if(!r.ok) throw 0; return r.json();}).then(j=>{Q=j; pageIdx={};
    Q.v.forEach((v,i)=>{(pageIdx[v[2]]=pageIdx[v[2]]||[]).push(i);}); Qloading=false; if(tab==="quran") renderPanel();})
  .catch(()=>{Qloading=false;Qerr=true; if(tab==="quran") renderPanel();});
}
function portion(d){
  if(d.quran&&d.quran.read) return [d.quran.from,d.quran.to];
  const from=Math.min(604,Math.max(1,Number(settings.qPage)||1));
  return [from,Math.min(604,from+(Number(settings.qPages)||2)-1)];
}
function viewQuran(d){
  const [from,to]=portion(d), read=d.quran&&d.quran.read;
  const done=(Number(settings.qPage)||1)-1, pct=Math.round(done/604*100);
  const left=604-done, per=Number(settings.qPages)||2, finish=new Date(); finish.setDate(finish.getDate()+Math.ceil(left/per));
  const prevRef=days[shift(cur,-1)]&&days[shift(cur,-1)].reflect;
  let body="";
  if(!Q){ loadQuran(); body=Qerr?`<p class="hint">Couldn't load the Quran text. Check your connection and reopen this tab.</p>`:`<p class="hint">Opening the mushaf…</p>`; }
  else {
    let lastCh=0; const parts=[];
    for(let p=from;p<=to;p++) (pageIdx[p]||[]).forEach(i=>{const v=Q.v[i];
      if(v[0]!==lastCh){lastCh=v[0];const c=Q.c[v[0]-1];if(v[1]===1)parts.push(`<div class="surah"><span class="sar">${esc(c[2])}</span><b>Surah ${esc(c[0])}</b><span class="small muted">${esc(c[1])} · ${c[3]} ayat</span></div>${v[0]!==1&&v[0]!==9?`<p class="ar" style="text-align:center">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>`:""}`);
        else parts.push(`<p class="label" style="margin-top:6px">Surah ${esc(c[0])}, continued</p>`);}
      parts.push(`<div class="verse"><span class="vn">${v[0]}:${v[1]}</span><p class="ar" lang="ar">${esc(v[3])}</p><p class="en">${esc(v[4])}</p></div>`);});
    const first=Q.v[(pageIdx[from]||[0])[0]], last=Q.v[(pageIdx[to]||[0]).slice(-1)[0]];
    body=`<p class="hint">Want a modern translation or tafsir for these ayat? <a href="https://quran.com/${first[0]}/${first[1]}" target="_blank" rel="noopener">Open on Quran.com</a></p>${parts.join("")}<p class="small muted">Ayat ${first[0]}:${first[1]} to ${last[0]}:${last[1]}</p>`;
  }
  return `
  <section class="sec">
    <div class="head"><h2 class="ht">${I("book","green")}Your daily Quran</h2>
      <p class="why">Best time: right after Fajr. Your mind is rested and the house is quiet, and it rides on a prayer you already do. The Quran itself praises the recital at dawn: "Lo! (the recital of) the Qur'an at dawn is ever witnessed" (17:78).</p></div>
    <div class="qhead"><b>Page ${read?to:done} of 604</b><span class="small muted">${pct}% · finish around ${finish.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="row"><span class="hint">Pages a day</span><div class="pills">${[1,2,4].map(n=>`<button class="pill" data-act="qpages" data-n="${n}" aria-pressed="${per===n}">${n}</button>`).join("")}</div></div>
  </section>
  ${prevRef?`<section class="sec"><div class="head"><span class="row">${I("bookmark","peach","sm")}<span class="label">Yesterday this stayed with you</span></span></div><p class="en" style="font-weight:700">${esc(prevRef)}</p><p class="hint">Recalling it today helps it stick for good.</p></section>`:""}
  <section class="sec">
    <div class="head"><div class="qhead"><h2 class="ht">${I("bookmark","gold")}Today: page${from===to?"":"s"} ${from}${from===to?"":"–"+to}</h2>${read?`<span class="tag">Read ✓</span>`:""}</div></div>
    ${body}
  </section>
  <section class="sec">
    <div class="head"><h2 class="ht">${I("pen","peach")}One ayah that stayed with me</h2><p class="why">Putting a verse in your own words is how you learn it, not just read it. You'll see it again tomorrow morning.</p></div>
    <textarea id="reflect" data-path="reflect" placeholder="Which ayah touched you today, and why?">${esc(d.reflect)}</textarea>
    ${read?`<button class="btn" data-act="qundo">Undo, I haven't read it yet</button>`:`<button class="btn primary" data-act="qdone" style="padding:14px">I've read today's portion</button>`}
  </section>
  <p class="hint" style="text-align:center">Arabic text: Tanzil. English: Marmaduke Pickthall (1930).</p>`;
}

/* ---------- money ---------- */
const CATS=["Food","Transport","Bills","Shopping","Family","Sadaqah","Other"];
const C_ICON={Food:"utensils",Transport:"car",Bills:"bolt",Shopping:"bag",Family:"home",Sadaqah:"heart",Other:"dots"};
let selCat="Food";
const money=n=>"Rs "+Math.round(Number(n)||0).toLocaleString("en-PK");
function spendOf(k){const d=days[k];return d&&d.spend?d.spend.reduce((a,e)=>a+(Number(e.amt)||0),0):0;}
function weekStart(k){const d=parseKey(k);return shift(k,-((d.getDay()+6)%7));}
function viewMoney(){
  const t=todayKey(), ws=weekStart(cur), idx=diffDays(ws,cur), budget=Number(settings.budget)||0;
  let week=0; const per=[]; for(let i=0;i<7;i++){const k=shift(ws,i);const v=spendOf(k);week+=v;per.push([k,v]);}
  const left=budget-week, daysLeft=Math.max(1,7-idx), ratio=budget?week/budget:0;
  const cls=!budget?"":ratio>1?"over":ratio>=.75?"hot":"ok";
  const allow=budget&&cur===t&&left>0?Math.floor(left/daysLeft):null;
  const d=day(), list=d.spend||[], max=Math.max(1,...per.map(p=>p[1]),budget?budget/7:0);
  const cats={};per.forEach(([k])=>{(days[k]&&days[k].spend||[]).forEach(e=>{cats[e.cat]=(cats[e.cat]||0)+(Number(e.amt)||0);});});
  const catList=Object.entries(cats).sort((a,b)=>b[1]-a[1]), cmax=Math.max(1,...catList.map(c=>c[1]));
  return `
  <section class="sec">
    <div class="head"><h2 class="ht">${I("wallet","blue")}This week</h2><p class="hint">Monday to Sunday.</p></div>
    <div class="row"><span class="hint" style="font-weight:800">Weekly budget (Rs)</span><input type="number" min="0" id="budget" data-set="budget" value="${esc(settings.budget)}" placeholder="e.g. 7000" style="width:130px" inputmode="numeric"></div>
    <div class="money-top"><div class="mt ${cls}"><span>Spent</span><b>${money(week)}</b></div><div class="mt"><span>Budget</span><b>${budget?money(budget):"Not set"}</b></div><div class="mt ${cls}"><span>${left<0?"Over by":"Left"}</span><b>${budget?money(Math.abs(left)):"–"}</b></div></div>
    ${budget?`<div class="bar money ${cls}"><i style="width:${Math.min(100,ratio*100)}%"></i></div>`:""}
    ${allow!==null?`<p class="allow">You can spend <b>${money(allow)}</b> a day for the next ${daysLeft} day${daysLeft===1?"":"s"} and stay on budget.</p>`:budget&&left<=0&&cur===t?`<p class="allow">Budget used up this week. Only essentials until Monday.</p>`:""}
  </section>
  <section class="sec">
    <div class="head"><h2 class="ht">${I("plus","green")}Add a spend</h2><p class="why">Cards and wallets hide the "pain of paying", so money leaks unnoticed (Prelec &amp; Loewenstein, 1998). Writing each spend down makes it real again.</p></div>
    <div class="row"><input type="number" min="0" id="amt" placeholder="Amount" inputmode="decimal" style="flex:0 0 130px"><input type="text" id="note" class="grow" placeholder="What for? (optional)"></div>
    <div class="pills">${CATS.map(c=>`<button class="pill" data-act="cat" data-c="${c}" aria-pressed="${c===selCat}">${I(C_ICON[c],"blue","xs")}${c}</button>`).join("")}</div>
    <button class="btn primary" data-act="addSpend" style="padding:13px">Add spend</button>
  </section>
  <section class="sec">
    <div class="head"><h2 class="ht">${I("receipt","pink")}${cur===t?"Today":"This day"} · ${money(spendOf(cur))}</h2></div>
    ${list.length?list.map((e,i)=>`<div class="exp">${I(C_ICON[e.cat]||"dots","lilac","sm")}<span class="cat">${esc(e.cat)}</span><span class="nt">${esc(e.note)||"&nbsp;"}</span><span class="am">${money(e.amt)}</span><button class="del" data-act="delSpend" data-i="${i}" aria-label="Delete">×</button></div>`).join(""):`<p class="hint">Nothing spent yet. Add each spend as it happens.</p>`}
  </section>
  <section class="sec">
    <div class="head"><h2 class="ht">${I("bars","peach")}Day by day</h2></div>
    <div class="wk">${per.map(([k,v],i)=>`<div class="col ${k===t?"today":""} ${k>t?"future":""}"><em>${v?Math.round(v).toLocaleString("en-PK"):""}</em><i style="height:${k>t?6:Math.max(2,v/max*100)}%"></i><span>${"MTWTFSS"[i]}</span></div>`).join("")}</div>
    ${catList.length?`<div class="field" style="gap:8px;margin-top:4px">${catList.map(([c,v])=>`<div class="catrow"><span style="font-weight:800">${esc(c)}</span><span class="track"><i style="width:${v/cmax*100}%"></i></span><span class="am">${money(v)}</span></div>`).join("")}</div>`:""}
  </section>`;
}

/* ---------- growth / stats ---------- */
let editRoutines=false;
function viewStats(){
  const t=todayKey(), chain=chainLen();
  const last14=[];for(let i=13;i>=0;i--){const kk=shift(t,-i);const d=days[kk];last14.push(kept(d)?"k":(d&&kk!==t?"m":""));}
  const end=parseKey(t), first=new Date(end); first.setDate(end.getDate()-((end.getDay()+6)%7)-49);
  const cells=[];
  for(let i=0;i<56;i++){const dd=new Date(first);dd.setDate(first.getDate()+i);const kk=keyOf(dd);const s=score(days[kk]);const fut=kk>t;
    const l=fut||!days[kk]?0:s>=70?3:s>=45?2:s>0?1:0;
    cells.push(`<i data-l="${l}" class="${kk===t?"today":""}" title="${kk}: ${days[kk]?s:"–"}" style="${fut?"opacity:.35":""}"></i>`);}
  let onTime=0,pr=0,blocks=0,mins=0,ast=0,qp=0,water=0,n=0,rt=0;
  for(let i=0;i<7;i++){const k=shift(t,-i),d=days[k]; if(!d) continue; n++;
    PRAYERS.forEach(([p])=>{if(d.prayers[p]===1)onTime++; if(d.prayers[p]===1||d.prayers[p]===2)pr++;});
    blocks+=d.focus; mins+=d.focusMin; ast+=d.astaghfar||0; water+=d.water||0; rt+=routineRatio(k);
    if(d.quran&&d.quran.read) qp+=(d.quran.to-d.quran.from+1);}
  const rstats=settings.routines.map(r=>{let due=0,done=0;for(let i=0;i<14;i++){const k=shift(t,-i);if(!days[k])continue;const s=routineStatus(r,k);if(s.due){due++;if(s.done)done++;}}return {r,due,done};});
  return `
  <section class="sec">
    <div class="head"><div class="bigchain">${I("link","blue")}<b>${chain}</b><h2>day${chain===1?"":"s"} in your chain</h2></div><p class="why">Never miss twice. One off day doesn't break the chain; two in a row does. Missing once barely affects habit formation (Lally et al., 2010).</p></div>
    <div class="chain">${last14.map(c=>`<i class="${c}"></i>`).join("")}</div>
    <div class="legend"><i style="background:var(--grass2);border-radius:50%"></i> kept <i style="border:2px dashed var(--rose);border-radius:50%"></i> missed · last 14 days</div>
  </section>
  <section class="sec">
    <div class="head"><h2 class="ht">${I("calendar","blue")}Last 7 days</h2></div>
    <div class="stats">
      <div class="stat">${I("mosque","gold","sm")}<b>${onTime}/35</b><span>prayers on time (${pr} prayed)</span></div>
      <div class="stat">${I("book","blue","sm")}<b>${qp}</b><span>Quran pages read</span></div>
      <div class="stat">${I("check","green","sm")}<b>${n?Math.round(rt/n*100):0}%</b><span>routines done</span></div>
      <div class="stat">${I("timer","peach","sm")}<b>${blocks}</b><span>focus blocks · ${mins} min</span></div>
      <div class="stat">${I("beads","lilac","sm")}<b>${ast}</b><span>astaghfar</span></div>
      <div class="stat">${I("drop","teal","sm")}<b>${n?(water/n).toFixed(1):0}</b><span>glasses of water a day</span></div>
    </div>
  </section>
  <section class="sec">
    <div class="head"><h2 class="ht">${I("grid","green")}Eight weeks</h2><p class="hint">Each square is a day. Greener means more of your plan got done.</p></div>
    <div class="heat">${["M","T","W","T","F","S","S"].map(x=>`<span class="dow">${x}</span>`).join("")}${cells.join("")}</div>
    <div class="legend">Less <i style="background:var(--soft);border:1px solid var(--line)"></i><i style="background:#DDEFD0"></i><i style="background:#A9D58A"></i><i style="background:var(--grass)"></i> More</div>
  </section>
  <section class="sec">
    <div class="head"><div class="row" style="justify-content:space-between"><h2 class="ht">${I("check","peach")}Routines</h2><button class="btn" data-act="editR">${editRoutines?"Done editing":"Edit routines"}</button></div><p class="hint">Last 14 days. Add, remove or change anything here.</p></div>
    ${editRoutines?routineEditor():rstats.map(({r,due,done})=>`<div class="rt"><span class="row" style="flex-wrap:nowrap">${I(routineIcon(r),SLOT_TONE[r.slot]||"blue","sm")}<span><b>${esc(r.name)}</b> <span class="small muted">· ${r.slot}</span></span></span><span class="tag">${due?Math.round(done/due*100)+"%":"–"}</span></div>`).join("")}
  </section>
  <section class="sec">
    <div class="head"><h2 class="ht">${I("gear","teal")}Settings</h2></div>
    <div class="row"><span class="hint">Daily water goal (glasses)</span><input type="number" min="1" max="20" id="waterGoal" data-set="waterGoal" value="${esc(settings.waterGoal)}" style="width:80px" inputmode="numeric"></div>
    <div class="row"><span class="hint">Quran: start from page</span><input type="number" min="1" max="604" id="qPage" data-set="qPage" value="${esc(settings.qPage)}" style="width:90px" inputmode="numeric"></div>
  </section>
  <section class="sec">
    <div class="head"><h2 class="ht">${I("download","blue")}Backup</h2><p class="hint">Save a backup file every week or so. Import it to restore everything, or to move your data into the other version of this planner.</p></div>
    <div class="row"><button class="btn primary" data-act="export">Export backup</button><label class="btn" for="importFile" style="display:inline-flex;align-items:center">Import backup</label><input type="file" id="importFile" accept="application/json,.json" hidden></div>
  </section>
  <section class="sec">
    <div class="head"><h2 class="ht">${I("bulb","gold")}Why this works</h2></div>
    <details><summary>Same cue every morning</summary><p>A fixed cue (wake, Fajr, this page) turns planning into a habit instead of a decision. Habits form through repetition in a stable context; a median of about 66 days (<b>Lally et al., 2010</b>; <b>Wood &amp; Neal, 2007</b>).</p></details>
    <details><summary>Small routines first</summary><p>Easy wins like making your bed are tiny, so they're hard to skip, and finishing them builds momentum. Anchoring new habits to existing ones helps them stick (<b>Fogg, 2019</b>).</p></details>
    <details><summary>Dumping worries</summary><p>Writing anxious thoughts out frees working memory (<b>Ramirez &amp; Beilock, 2011</b>). A set worry slot reduces how much worry intrudes on the day (<b>Borkovec et al., 1983</b>).</p></details>
    <details><summary>If-then rules</summary><p>Deciding in advance what you'll do in a specific moment roughly doubles follow-through (<b>Gollwitzer &amp; Sheeran, 2006</b>).</p></details>
    <details><summary>Morning light and a set bedtime</summary><p>Daylight soon after waking anchors your body clock, which makes it easier to fall asleep at night and wake for Fajr.</p></details>
    <details><summary>Never miss twice</summary><p>One missed day had no measurable effect on habit formation (<b>Lally et al., 2010</b>). Self-forgiveness reduces later procrastination (<b>Wohl et al., 2010</b>).</p></details>
    <details><summary>Wins and gratitude</summary><p>Small progress is the top booster of motivation (<b>Amabile &amp; Kramer, 2011</b>). Three good things each night improved wellbeing for months (<b>Seligman et al., 2005</b>).</p></details>
    <details><summary>Tracking at all</summary><p>Monitoring progress reliably raises the chance of reaching a goal (<b>Harkin et al., 2016</b>).</p></details>
  </section>`;
}
function routineEditor(){
  const sel=(i,f,val,opts)=>`<select data-r="${i}.${f}">${opts.map(([v,l])=>`<option value="${v}"${String(val)===String(v)?" selected":""}>${l}</option>`).join("")}</select>`;
  return settings.routines.map((r,i)=>`<div class="redit">
    <div class="row"><input type="text" class="grow" data-r="${i}.name" id="rname${i}" value="${esc(r.name)}"><button class="del" data-act="delR" data-i="${i}" aria-label="Remove ${esc(r.name)}">×</button></div>
    <input type="text" data-r="${i}.note" id="rnote${i}" value="${esc(r.note||"")}" placeholder="Note (optional)">
    <div class="grid">${sel(i,"slot",r.slot,[["morning","Morning"],["day","Day"],["night","Night"]])}${sel(i,"freq",r.freq,[["daily","Every day"],["interval","Every few days"],["weekly","Once a week"]])}</div>
    ${r.freq==="interval"?`<div class="row"><span class="hint">Every</span><input type="number" min="2" max="30" data-r="${i}.n" id="rn${i}" value="${esc(r.n||3)}" style="width:80px" inputmode="numeric"><span class="hint">days</span></div>`:""}
    ${r.freq==="weekly"?sel(i,"dow",r.dow??6,DOW.map((d,j)=>[j,d])):""}
  </div>`).join("")+`<button class="btn primary" data-act="addR">Add a routine</button><button class="btn ghost" data-act="resetR">Restore default routines</button>`;
}

/* ---------- sky ---------- */
function skyPhase(){if(cur!==todayKey()) return "day"; const n=new Date(), h=n.getHours()+n.getMinutes()/60;
  if(h<4.6||h>=19.8) return "night"; if(h<7.2) return "dawn"; if(h<15.8) return "day"; if(h<18.2) return "gold"; return "dusk";}
function setPhase(){document.body.dataset.phase=skyPhase(); setHeroImage();}
const IMGS={morning:"img/morning.webp",day:"img/day.webp",evening:"img/evening.webp",night:"img/night.webp",quran:"img/quran.webp"};
function heroKey(){const ph=skyPhase(), byTime=ph==="dawn"?"morning":ph==="day"?"day":ph==="night"?"night":"evening";
  if(tab==="morning") return "morning"; if(tab==="night") return "night"; if(tab==="quran") return "quran";
  if(tab==="day") return (ph==="gold"||ph==="dusk")?"evening":"day"; return byTime;}
let heroShown="";
function setHeroImage(){const img=document.getElementById("heroImg"); if(!img) return; const k=heroKey(); if(k===heroShown) return; heroShown=k;
  img.classList.remove("on"); const src=IMGS[k]; const pre=new Image();
  pre.onload=()=>{ if(heroShown!==k) return; img.src=src; img.classList.add("on"); document.getElementById("hero").classList.add("has-photo"); };
  pre.onerror=()=>{ document.getElementById("hero").classList.remove("has-photo"); };
  pre.src=src;}
function preloadImages(){Object.values(IMGS).forEach(s=>{const i=new Image();i.src=s;});}

/* ---------- prayer arc ---------- */
const ANG=[166,100,50,14,-9];
function pt(a){const cx=160,cy=96,rx=138,ry=72,t=a*Math.PI/180;return [cx+rx*Math.cos(t),cy-ry*Math.sin(t)];}
function drawArc(){
  const d=day(), svg=document.getElementById("arc"); if(!svg) return;
  let last=-1; PRAYERS.forEach(([p],i)=>{ if(d.prayers[p]===1||d.prayers[p]===2) last=i; });
  const samp=(from,to)=>{const pts=[];for(let a=from;a>=to;a-=2)pts.push(pt(a).map(v=>v.toFixed(1)).join(","));pts.push(pt(to).map(v=>v.toFixed(1)).join(","));return pts.join(" ");};
  let out=`<defs><radialGradient id="sunG"><stop offset="0" stop-color="#FFF8D6"/><stop offset=".5" stop-color="#FFD866" stop-opacity=".9"/><stop offset="1" stop-color="#FFC83D" stop-opacity="0"/></radialGradient><linearGradient id="trail" x1="0" x2="1"><stop offset="0" stop-color="#FFE08A"/><stop offset="1" stop-color="#F3A54A"/></linearGradient><mask id="cm"><rect width="320" height="112" fill="#fff"/><circle cx="302" cy="12" r="9" fill="#000"/></mask></defs>`;
  out+=`<polyline points="${samp(180,-12)}" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="3" stroke-dasharray="1 7" stroke-linecap="round"/>`;
  if(last>=0) out+=`<polyline points="${samp(180,ANG[last])}" fill="none" stroke="url(#trail)" stroke-width="4.5" stroke-linecap="round"/>`;
  PRAYERS.forEach(([p,n],i)=>{const [x,y]=pt(ANG[i]);const s=d.prayers[p];
    const fill=s===1?"#FFD866":s===2?"#FFB46B":s===3?"#FFD0DA":"#FFFFFF", stroke=s===1?"#E39B2E":s===2?"#E0812A":s===3?"#D9637A":"rgba(44,58,43,.4)";
    out+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="8" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;
    if(s===1) out+=`<path d="M${(x-3.4).toFixed(1)} ${y.toFixed(1)} l2.4 2.4 l4.4 -4.6" fill="none" stroke="#2C3A2B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`;
    const ly=i===4?y+21:y-13;
    out+=`<text x="${x.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" font-family="Nunito,system-ui,sans-serif" font-size="11" font-weight="800" fill="#2C3A2B" stroke="rgba(255,253,246,.92)" stroke-width="3.5" paint-order="stroke">${n}</text>`;});
  svg.innerHTML=out;
}

/* ---------- delight ---------- */
let toastT=null;
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2400);}
function confetti(){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let c=document.getElementById("fx"); if(!c){c=document.createElement("canvas");c.id="fx";document.body.appendChild(c);}
  const dpr=window.devicePixelRatio||1,W=innerWidth,H=innerHeight;c.width=W*dpr;c.height=H*dpr;const g=c.getContext("2d");if(!g)return;g.scale(dpr,dpr);
  const cols=["#FFD866","#F7A7B9","#9CD27E","#A795DA","#7EC3EC","#FFFFFF"];
  const ps=Array.from({length:80},()=>({x:W/2+(Math.random()-.5)*80,y:H*.4,vx:(Math.random()-.5)*10,vy:-Math.random()*10-4,r:Math.random()*7,vr:(Math.random()-.5)*.25,s:Math.random()*5+4,c:cols[Math.floor(Math.random()*cols.length)],leaf:Math.random()<.4}));
  const t0=performance.now();
  (function f(t){const k=(t-t0)/1800;g.clearRect(0,0,W,H);
    ps.forEach(p=>{p.vy+=.26;p.vx*=.985;p.x+=p.vx+Math.sin(t/200+p.r)*.6;p.y+=p.vy;p.r+=p.vr;g.save();g.globalAlpha=Math.max(0,1-k);g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;
      if(p.leaf){g.beginPath();g.ellipse(0,0,p.s,p.s*.45,0,0,7);g.fill();}else{for(let i=0;i<5;i++){const a=i/5*7;g.beginPath();g.arc(Math.cos(a)*p.s*.4,Math.sin(a)*p.s*.4,p.s*.35,0,7);g.fill();}}g.restore();});
    if(k<1)requestAnimationFrame(f);else g.clearRect(0,0,W,H);})(t0);
}
let lastScore=null;
function checkMilestone(){const s=score(day());if(lastScore!==null&&cur===todayKey()){
  if(lastScore<50&&s>=50) toast("Halfway there. Your chain is safe today.");
  else if(lastScore<80&&s>=80){toast("MashaAllah, a beautiful day.");confetti();}}
  lastScore=s;}

/* ---------- timer ---------- */
const T={len:25*60,left:25*60,running:false,end:0,iv:null};
function fmt(s){s=Math.max(0,Math.round(s));return pad(Math.floor(s/60))+":"+pad(s%60)}
function tick(){
  if(!T.running) return;
  T.left=(T.end-Date.now())/1000;
  if(T.left<=0){T.left=0;T.running=false;clearInterval(T.iv);const d=day(todayKey());d.focus+=1;d.focusMin+=Math.round(T.len/60);persist(todayKey());beep();confetti();toast("Block done. That's a real start.");T.left=T.len;renderPanel();updateScore();return;}
  const c=document.getElementById("clock"); if(c) c.textContent=fmt(T.left);
  const b=document.getElementById("tbar"); if(b) b.style.width=((1-T.left/T.len)*100)+"%";
  document.title=fmt(T.left)+" · Focus";
}
let actx=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=660;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.0001,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(.2,actx.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+t+.3);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.32);});}catch(e){} document.title="Itrat's Daily Planner";}

/* ---------- render ---------- */
function renderPanel(){
  const p=document.getElementById("panel"), d=day();
  p.innerHTML=tab==="morning"?viewMorning(d):tab==="day"?viewDay(d):tab==="night"?viewNight(d):tab==="quran"?viewQuran(d):tab==="money"?viewMoney():viewStats();
  document.querySelectorAll(".nav button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===tab)));
}
function renderAll(){renderHeader();renderPanel();}
function goTab(t){tab=t;try{localStorage.setItem(LS+"-tab",tab)}catch(_){}renderPanel();setHeroImage();window.scrollTo({top:0});}

/* ---------- events ---------- */
document.querySelector(".nav").addEventListener("click",e=>{const b=e.target.closest("button");if(b) goTab(b.dataset.tab);});
document.getElementById("prevDay").onclick=()=>{cur=shift(cur,-1);renderAll();};
document.getElementById("nextDay").onclick=()=>{cur=shift(cur,1);renderAll();};
document.getElementById("goToday").onclick=()=>{cur=todayKey();renderAll();};
const panel=document.getElementById("panel");
panel.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.path){ setPath(day(),el.dataset.path,el.value); persist(cur); updateScore(); }
  else if(el.dataset.set){ let v=el.value; if(["qPage","waterGoal"].includes(el.dataset.set)) v=Number(v)||settings[el.dataset.set]; setPath(settings,el.dataset.set,v); persist("settings"); }
  else if(el.dataset.r&&el.tagName==="INPUT"){ const [i,f]=el.dataset.r.split("."); settings.routines[i][f]=f==="n"?Math.max(1,Number(el.value)||1):el.value; persist("settings"); }
});
panel.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="importFile"&&el.files&&el.files[0]){ importData(el.files[0]); el.value=""; return; }
  if(el.tagName==="SELECT"&&el.dataset.path){ setPath(day(),el.dataset.path,el.value); persist(cur); }
  if(el.tagName==="SELECT"&&el.dataset.r){ const [i,f]=el.dataset.r.split("."); const r=settings.routines[i]; r[f]=f==="dow"?Number(el.value):el.value; if(f==="freq"){ if(el.value==="interval"&&!r.n) r.n=3; if(el.value==="weekly"&&r.dow===undefined) r.dow=6; } persist("settings"); renderPanel(); }
  if(el.dataset.set==="budget"||el.dataset.set==="waterGoal") { renderPanel(); updateScore(); }
});
panel.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const d=day(), a=b.dataset.act;
  if(a==="set"){ const v=Number(b.dataset.val); setPath(d,b.dataset.path,getPath(d,b.dataset.path)===v?0:v); }
  else if(a==="toggle"){ const p=b.dataset.path, v=!getPath(d,p); setPath(d,p,v);
    if(v){ if(p==="mit.done"){confetti();toast("One thing done. Alhamdulillah.");} else if(p.startsWith("tasks")) toast("Nice. Keep the momentum.");
      else if(p==="walk") toast("Walk done. Fresh air, fresh mind."); else if(p==="build") toast("You built something today."); else if(p==="minimum") toast("Minimum day on. Small still counts."); } }
  else if(a==="routine"){ const id=b.dataset.id; d.routine[id]=!d.routine[id];
    if(d.routine[id]){ const r=settings.routines.find(x=>x.id===id); const slot=r?r.slot:""; const left=routinesFor(slot).filter(x=>x.s.due&&!x.s.done).length;
      if(!left){confetti();toast(slot==="morning"?"Morning routine complete. What a start!":slot==="night"?"Night routine done. Sleep well.":"All done here. Lovely.");}
      else if(id==="vit") toast("Vitamins taken. Your future self says thanks.");
      else toast("Nice one. Keep going."); } }
  else if(a==="prayer"){ const before=prayed(d); d.prayers[b.dataset.p]=(d.prayers[b.dataset.p]+1)%4;
    if(prayed(d)===5&&before<5){confetti();toast("All five prayers. MashaAllah.");}
    else if(d.prayers[b.dataset.p]===1) toast(b.querySelector("b").textContent+" on time. MashaAllah.");
    else if(d.prayers[b.dataset.p]===2) toast("Late still counts. Next one on time."); }
  else if(a==="tasbih"){ d.astaghfar+=1; if(navigator.vibrate){try{navigator.vibrate(d.astaghfar%33===0?60:8)}catch(_){}}
    if(d.astaghfar%33===0){ const r=d.astaghfar/33; if(r===5){confetti();toast("165 today. SubhanAllah.");} else toast("Round "+r+" of 5 complete."); }
    else { const el=document.getElementById("tCount"); if(el){ el.textContent=d.astaghfar; b.querySelector("svg").outerHTML=ringSVG(d.astaghfar); } persist(cur); updateScore(); return; } }
  else if(a==="tasbihAdd"){ d.astaghfar=Math.max(0,d.astaghfar+Number(b.dataset.n)); }
  else if(a==="water"){ const n=Number(b.dataset.n); d.water=(d.water===n?n-1:n); if(d.water===(Number(settings.waterGoal)||8)){confetti();toast("Water goal reached. Well done.");} }
  else if(a==="cnt"){ const k=b.dataset.k; d[k]=Math.max(0,(d[k]||0)+Number(b.dataset.n)); if(k==="waitStay"&&Number(b.dataset.n)>0) toast("You stayed. That's the muscle growing."); }
  else if(a==="mode"){ if(T.running) return; T.len=T.left=Number(b.dataset.m)*60; renderPanel(); return; }
  else if(a==="timer"){ if(T.running){T.running=false;clearInterval(T.iv);T.left=(T.end-Date.now())/1000;document.title="Itrat's Daily Planner";}
    else {T.running=true;T.end=Date.now()+T.left*1000;clearInterval(T.iv);T.iv=setInterval(tick,250);try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();}catch(_){} } renderPanel(); return; }
  else if(a==="treset"){ T.running=false;clearInterval(T.iv);T.left=T.len;document.title="Itrat's Daily Planner";renderPanel();return; }
  else if(a==="gotab"){ goTab(b.dataset.tab); return; }
  else if(a==="qpages"){ settings.qPages=Number(b.dataset.n); persist("settings"); renderPanel(); return; }
  else if(a==="qdone"){ const [f,t]=portion(d); d.quran={read:true,from:f,to:t}; settings.qPage=t>=604?1:t+1; persist("settings");
    if(t>=604){confetti();toast("You finished the whole Quran. MashaAllah!");} else {confetti();toast("Today's Quran done. Alhamdulillah.");} }
  else if(a==="qundo"){ settings.qPage=d.quran.from; d.quran={read:false,from:0,to:0}; persist("settings"); }
  else if(a==="cat"){ selCat=b.dataset.c; renderPanel(); return; }
  else if(a==="addSpend"){ const amtEl=document.getElementById("amt"), v=Number(amtEl.value);
    if(!(v>0)){ toast("Enter an amount first."); amtEl.focus(); return; }
    d.spend.push({amt:v,cat:selCat,note:document.getElementById("note").value.trim(),t:Date.now()});
    const budget=Number(settings.budget)||0, ws=weekStart(cur); let wk=0; for(let i=0;i<7;i++) wk+=spendOf(shift(ws,i));
    toast(budget?(wk>budget?"Added. You're over this week's budget.":"Added. "+money(budget-wk)+" left this week."):"Added "+money(v)+"."); }
  else if(a==="delSpend"){ d.spend.splice(Number(b.dataset.i),1); }
  else if(a==="editR"){ editRoutines=!editRoutines; renderPanel(); return; }
  else if(a==="delR"){ settings.routines.splice(Number(b.dataset.i),1); persist("settings"); renderPanel(); updateScore(); return; }
  else if(a==="addR"){ settings.routines.push({id:"r"+Date.now().toString(36),name:"New routine",slot:"day",freq:"daily"}); persist("settings"); renderPanel(); const ins=panel.querySelectorAll(".redit input[data-r$='.name']"); const last=ins[ins.length-1]; if(last){last.focus();last.select();} return; }
  else if(a==="resetR"){ settings.routines=clone(DEFAULT_ROUTINES); persist("settings"); renderPanel(); updateScore(); toast("Default routines restored."); return; }
  else if(a==="export"){ exportData(); return; }
  persist(cur); renderPanel(); updateScore();
});

/* ---------- boot ---------- */
loadLocal();
try{const st=localStorage.getItem(LS+"-tab-date"); if(st===todayKey()){const tb=localStorage.getItem(LS+"-tab"); if(tb&&["morning","day","night","quran","money","stats"].includes(tb)) tab=tb;} localStorage.setItem(LS+"-tab-date",todayKey());}catch(e){}
setPhase();
renderAll();
setTimeout(preloadImages,1500);
if(STANDALONE){
  document.getElementById("foot").textContent="Saved on this device · export a backup now and then";
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  try{ if("serviceWorker" in navigator&&location.protocol==="https:") navigator.serviceWorker.register("sw.js"); }catch(e){}
} else connect();
setInterval(()=>{ drawArc(); setPhase(); },60000);
})();
</script>
